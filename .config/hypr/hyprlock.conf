general {
  monitor = eDP-1
  disable_loading_bar = true
  hide_cursor = true
  grace = 2
  no_fade_in = false
  no_fade_out = false
  time_out = 2000
}

background {
  path = screenshot # only png supported for now
  color = rgb(293E40)

  # all these options are taken from hyprland, see https://wiki.hyprland.org/Configuring/Variables/#blur for explanations
  blur_passes = 5 # 0 disables blurring
  blur_size = 3
  noise = 0.0117
  contrast = 0.8916
  brightness = 0.8172
  vibrancy = 0.1696
  vibrancy_darkness = 0.0
}

input-field {
  size = 200, 50
  outline_thickness = 1
  dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
  dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
  dots_center = false
  outer_color = rgb(313B84)  
  inner_color = rgb(293E40)
  font_color = rgb(C0C2C3) 
  placeholder_text = Enter Password... # Text rendered in the input box when it's empty.
  check_color = rgb(23233B) 
  fail_color = rgb(204, 34, 34)
  hide_input = false
  rounding = 5
  position = 0, -20
  halign = center
  valign = center
  shadow_passes = 1
  shadow_size = 1
}

shape {
  size = 200, 90
  position = 0, 75
  color = rgb(293E40)
  border_color = rgb(313B84)
  border_size = 1
  rounding = 5
  halign = center
  valign = center
  shadow_passes = 1
  shadow_size = 1
}

label {
  monitor = 
  text = Hello, $USER
  color = rgb(C0C2C3) 
  font_size = 18
  font_family = Iosevka NF

  position = 0, 60
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%I:%M %p")"
  color = rgb(C0C2C3) 
  font_size = 25
  font_family = Iosevka NF
  position = 0, 90
  halign = center
  valign = center
}
